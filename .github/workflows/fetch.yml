name: Fetch jobs

on:
  schedule:
    # 07:17 UTC = 3:17 AM Toronto (EDT) / 2:17 AM (EST).
    # GitHub delays scheduled runs under load (we've seen 5-9h late at :30), so
    # run early and off the :00/:30 peak. The Claude digest (9:13 AM Toronto)
    # reads every data/daily file from the last 3 days, so a late run is picked
    # up the next morning instead of being lost.
    - cron: "17 7 * * *"
  workflow_dispatch: {}   # "Run workflow" button in the Actions tab

permissions:
  contents: write         # needed to commit data/ back to the repo

concurrency:
  group: fetch-jobs
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python fetch_jobs.py

      - name: Commit results
        run: |
          git config user.name "job-fetcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && exit 0
          git commit -m "data: daily fetch $(date -u +%F) [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
