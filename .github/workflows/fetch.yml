name: Fetch jobs

on:
  schedule:
    # GitHub cron is UTC-only and ignores daylight saving.
    # 05:01 UTC = 12:01 AM Toronto in winter (EST) / 1:01 AM in summer (EDT).
    # GitHub often starts scheduled runs hours late, so the backup slots below
    # catch the day if the first one is delayed. Only the first scheduled run
    # of the day does any work; the rest exit in seconds (guard in main()).
    # The Claude digest (9:13 AM Toronto) reads the last 3 days of data/daily
    # files, so even a very late run is picked up the next morning.
    - cron: "1 5 * * *"
    - cron: "17 7 * * *"
    - cron: "23 9 * * *"
    - cron: "41 11 * * *"
  workflow_dispatch: {}   # "Run workflow" button in the Actions tab

permissions:
  contents: write         # needed to commit data/ back to the repo

concurrency:
  group: fetch-jobs
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python fetch_jobs.py

      - name: Commit results
        run: |
          git config user.name "job-fetcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && exit 0
          git commit -m "data: daily fetch $(date -u +%F) [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
